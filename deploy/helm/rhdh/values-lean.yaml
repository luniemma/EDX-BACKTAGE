# Lean EKS: real cluster, no RDS, no NAT gateway.
#
# The trade against values-prod.yaml is deliberate and worth stating plainly:
# PostgreSQL runs as a single in-cluster pod on a Spot node. If that node is
# reclaimed the database restarts, and the EBS volume follows it only within
# the same AZ. There are no backups. This is a demo/evaluation profile — use
# values-prod.yaml and a real RDS instance for anything that matters.

global:
  # MUST match how the browser actually reaches the portal, scheme and host
  # exactly, or the frontend calls the wrong origin and every API request
  # fails CORS.
  #
  # Left empty on purpose: the hostname is the NLB that ingress-nginx creates,
  # which does not exist until terraform/platform-addons is applied. Fill it in
  # and commit — ArgoCD syncs the change. templates/validate.yaml fails the
  # render while this is empty, which is the intended behaviour: better a
  # failed sync than a portal that half-works.
  #
  #   kubectl -n ingress-nginx get svc ingress-nginx-controller \
  #     -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
  #
  # Hostname only, no scheme and no port. The RHDH chart interpolates this into
  # 'https://{{ rhdh.hostname }}', so a scheme here yields "https://http://..."
  # and an Ingress host with a port is rejected by the API server.
  host: "a110f8be2946448c68f3bfdbeb544ef7-495d1831d5da57c3.elb.us-east-1.amazonaws.com"

  edx:
    logLevel: info

backstage:
  upstream:
    ingress:
      enabled: true
      className: nginx
      # Same value as global.host. No port suffix here — an Ingress host with
      # a port is rejected by the API server. Leaving this empty renders an
      # Ingress rule with no host, which matches every request reaching the
      # controller rather than failing loudly.
      host: a110f8be2946448c68f3bfdbeb544ef7-495d1831d5da57c3.elb.us-east-1.amazonaws.com
      tls:
        # No certificate yet. The NLB hostname is not a name you can issue a
        # public certificate for; put a real domain in front and switch this
        # on with cert-manager before exposing anything real.
        enabled: false

    # In-cluster PostgreSQL instead of RDS (-$13/month). The chart wires
    # POSTGRES_HOST/PORT/USER and the generated admin password into the pod,
    # so appConfig needs no database stanza.
    # Migrated off the in-cluster pod. That pod was a single replica on a Spot
    # node with no backups and no failover: a node reclamation restarted the
    # database, and losing its volume lost the catalog outright. RDS is the
    # smallest change that makes the data survive the cluster.
    #
    # The instance lives in terraform/platform-db, a separate state from the
    # cluster on purpose, so `destroy.yml` can tear the cluster down without
    # taking the database with it.
    postgresql:
      enabled: false
      auth:
        # The chart still needs to know where to read the password, even with
        # its own PostgreSQL disabled — POSTGRESQL_ADMIN_PASSWORD is wired
        # from this Secret regardless of who runs the database.
        existingSecret: rhdh-db
        secretKeys:
          adminPasswordKey: postgres-password

    backstage:
      # Same volume-ownership problem as PostgreSQL, different symptom. The
      # init container unpacks dynamic plugins onto a PVC and dies on:
      #
      #   PermissionError: [Errno 13] Permission denied:
      #   '/dynamic-plugins-root/install-dynamic-plugins.lock'
      #
      # values.yaml sets podSecurityContext with runAsNonRoot and a seccomp
      # profile but deliberately no runAsUser or fsGroup, reasoning that
      # OpenShift assigns a uid per namespace and pinning one breaks it. That
      # is right about runAsUser and wrong to extend to fsGroup: fsGroup does
      # not pin the uid, it tells the kubelet which group to chown the mounted
      # volume to. Without it a fresh EBS volume stays root-owned and the
      # non-root image cannot write to it.
      #
      # 1001 is the uid/gid the RHDH image runs as. Kubernetes adds fsGroup to
      # the pod's supplementary groups, so the process is in it regardless of
      # its primary gid.
      podSecurityContext:
        fsGroup: 1001

      # The chart derives app.baseUrl, backend.baseUrl and backend.cors.origin
      # from global.host as 'https://<host>' — hardcoded scheme. This profile
      # terminates no TLS (there is no certificate you can issue for an
      # amazonaws.com NLB name), so the NLB serves plain HTTP on :80 and those
      # https URLs would be wrong: the portal would load and then every API
      # call from the frontend would fail against an origin nothing serves.
      #
      # Override all three explicitly. Change these together with global.host,
      # and switch them to https the moment a real domain and certificate are
      # in front of this.
      appConfig:
        app:
          baseUrl: http://a110f8be2946448c68f3bfdbeb544ef7-495d1831d5da57c3.elb.us-east-1.amazonaws.com
        backend:
          baseUrl: http://a110f8be2946448c68f3bfdbeb544ef7-495d1831d5da57c3.elb.us-east-1.amazonaws.com
          cors:
            origin: http://a110f8be2946448c68f3bfdbeb544ef7-495d1831d5da57c3.elb.us-east-1.amazonaws.com

          database:
            client: pg
            connection:
              # Hostname only, no port and no scheme — RHDH joins it to `port`
              # itself. Empty until terraform/platform-db is applied, and
              # templates/validate.yaml fails the render while it is, which is
              # deliberate: with postgresql.enabled false there is no fallback
              # to silently start against.
              #
              #   terraform -chdir=terraform/platform-db output -raw endpoint
              #
              host: edx-rhdh-postgres.cxuqo860cpxd.us-east-1.rds.amazonaws.com
              port: 5432
              # Must match db_username in terraform/platform-db.
              user: backstage
              password: ${POSTGRESQL_ADMIN_PASSWORD}
              # RDS terminates TLS with a cert from the Amazon RDS CA, which is
              # not in the image's trust store. rejectUnauthorized false keeps
              # the connection encrypted while not verifying the chain — the
              # traffic never leaves the VPC and never crosses a subnet with a
              # route out. Mount the RDS CA bundle and turn this on if that
              # stops being true.
              ssl:
                rejectUnauthorized: false

      # Two t3.medium Spot nodes total, shared with ingress-nginx, ArgoCD and
      # the EBS CSI controller. One RHDH replica is what actually fits.
      replicas: 1

      pdb:
        create: false

      autoscaling:
        enabled: false

      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 2Gi
          # The init container unpacks every dynamic plugin here before the
          # backend starts; this is why nodes get a 40Gi root volume.
          ephemeral-storage: 5Gi

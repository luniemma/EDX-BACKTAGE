apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhdh-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: backstage
  source:
    repoURL: https://github.com/luniemma/EDX-BACKTAGE.git
    targetRevision: main
    path: deploy/helm/rhdh
    helm:
      releaseName: rhdh
      valueFiles:
        - values.yaml
        - values-dev.yaml
      # No image.tag bump here any more. The image is Red Hat's, pinned in
      # values.yaml, and moves only when someone edits that file — there is no
      # build to promote.
  destination:
    server: https://kubernetes.default.svc
    namespace: rhdh-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 5

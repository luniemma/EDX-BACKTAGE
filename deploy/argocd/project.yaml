apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: backstage
  namespace: argocd
spec:
  description: Red Hat Developer Hub portal
  sourceRepos:
    - https://github.com/luniemma/EDX-BACKTAGE.git
    # The RHDH chart is a Helm dependency, so ArgoCD fetches it from Red Hat's
    # repository during `helm dependency build` and must be allowed to.
    - https://redhat-developer.github.io/rhdh-chart
    # Pulled transitively: the RHDH chart depends on bitnami/common.
    - https://charts.bitnami.com/bitnami
  destinations:
    - namespace: rhdh-*
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
    # Created by hand in rhdh-lean, deliberately outside git: rhdh-db holds the
    # database password copied from Secrets Manager, rhdh-secrets the GitHub
    # OAuth credentials. Without these entries every deploy reports them as
    # orphaned, which buries a real unowned resource under an expected warning.
    ignore:
      - kind: Secret
        name: rhdh-db
      - kind: Secret
        name: rhdh-secrets

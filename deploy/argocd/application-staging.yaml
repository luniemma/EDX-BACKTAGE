apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhdh-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: backstage
  source:
    repoURL: https://github.com/luniemma/EDX-BACKTAGE.git
    targetRevision: main
    path: deploy/helm/rhdh
    helm:
      releaseName: rhdh
      valueFiles:
        - values.yaml
        - values-staging.yaml
      # The sync fails to render until the RDS endpoint is filled in — see
      # templates/validate.yaml. Set it in values-staging.yaml under
      # backstage.upstream.backstage.appConfig.backend.database.connection.host.
  destination:
    server: https://kubernetes.default.svc
    namespace: rhdh-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 7

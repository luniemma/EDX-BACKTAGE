apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhdh-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: backstage
  source:
    repoURL: https://github.com/luniemma/EDX-BACKTAGE.git
    # Track a release branch or specific tag in prod, NOT main. values-prod.yaml
    # also points the catalog root Location at this branch, so entity edits on
    # main do not reach production until the branch moves.
    targetRevision: release/prod
    path: deploy/helm/rhdh
    helm:
      releaseName: rhdh
      valueFiles:
        - values.yaml
        - values-prod.yaml
      # The sync fails to render until the RDS endpoint is filled in — see
      # templates/validate.yaml. Set it in values-prod.yaml under
      # backstage.upstream.backstage.appConfig.backend.database.connection.host.
  destination:
    server: https://kubernetes.default.svc
    namespace: rhdh-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 10

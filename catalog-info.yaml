apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: backstage
  description: The developer portal itself, and the platform that delivers it.
  annotations:
    github.com/project-slug: luniemma/EDX-BACKTAGE
    # `url:` rather than `dir:.` on purpose. A dir reference resolves relative to
    # the entity's own location, which inside the container is the image — and
    # .dockerignore excludes `docs` and `*.md`, so there would be nothing to
    # build. A url reference makes TechDocs fetch the repo from GitHub, which
    # works the same in the pod as it does locally.
    backstage.io/techdocs-ref: url:https://github.com/luniemma/EDX-BACKTAGE
spec:
  type: website
  owner: group:default/developers
  lifecycle: experimental

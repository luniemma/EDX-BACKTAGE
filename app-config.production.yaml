app:
  # Should be the same as backend.baseUrl when using the `app-backend` plugin.
  baseUrl: http://localhost:7007

backend:
  # Note that the baseUrl should be the URL that the browser and other clients
  # should use when communicating with the backend, i.e. it needs to be
  # reachable not just from within the backend host, but from all of your
  # callers. When its value is "http://localhost:7007", it's strictly private
  # and can't be reached by others.
  baseUrl: http://localhost:7007
  # The listener can also be expressed as a single <host>:<port> string. In this case we bind to
  # all interfaces, the most permissive setting. The right value depends on your specific deployment.
  listen: ':7007'

  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      # https://node-postgres.com/features/ssl
      # you can set the sslmode configuration option via the `PGSSLMODE` environment variable
      # see https://www.postgresql.org/docs/current/libpq-ssl.html Table 33.1. SSL Mode Descriptions (e.g. require)
      # ssl:
      #   ca: # if you have a CA file and want to verify it you can uncomment this section
      #     $file: <file-path>/ca/server.crt

auth:
  environment: production
  providers:
    # No guest provider. The backend no longer registers the module either —
    # see packages/backend/src/index.ts, which is the change that actually
    # disables it.
    github:
      production:
        # Both come from the Secret, never from a values file. Set them with
        # `--set secrets.githubClientId=...` for a local trial, or through the
        # external store via ExternalSecret for anything shared.
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        signIn:
          resolvers:
            # Maps the GitHub login to a User entity of the same name. It
            # resolves against the catalog, so a matching User must exist or
            # sign-in fails with "unable to resolve user identity" — examples/
            # org.yaml provides `guest` today; real users come from
            # GithubOrgEntityProvider (Step 6).
            - resolver: usernameMatchingUserEntityName

techdocs:
  builder: 'local'
  generator:
    # 'local' rather than the 'docker' used in app-config.yaml. The backend
    # shells out to mkdocs, which the runtime image installs into a virtualenv
    # (see Dockerfile). 'docker' would try to START a container, and there is no
    # Docker daemon inside this pod — docs builds then fail at request time
    # rather than at deploy time, which is why the default looks fine and isn't.
    runIn: 'local'
  publisher:
    # Generated docs are written to disk. The container runs with
    # readOnlyRootFilesystem, so this has to be the emptyDir the chart mounts at
    # /tmp — anywhere else and the build fails with EROFS.
    type: 'local'
    local:
      publishDirectory: '/tmp/techdocs'

catalog:
  # Overrides the default list locations from app-config.yaml as these contain example data.
  # See https://backstage.io/docs/features/software-catalog/#adding-components-to-the-catalog for more details
  # on how to get entities into the catalog.
  locations:
    # Local example data, replace this with your production config, these are intended for demo use only.
    # File locations are relative to the backend process, typically in a deployed context, such as in a Docker container, this will be the root
    - type: file
      target: ./examples/entities.yaml

    # Local example template
    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]

    # Local example organizational data
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]

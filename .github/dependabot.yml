version: 2
updates:
  # The npm and docker ecosystems went with the application source: RHDH ships
  # as a prebuilt image whose contents Red Hat patches, and this repo no longer
  # has a package.json or a Dockerfile for dependabot to read. The image tag is
  # pinned by hand in deploy/helm/rhdh — see that chart's README for how to move
  # it, and note that Chart.yaml appVersion and the catalog index tag have to
  # move with it or CI fails.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly

name: drift

# Reports infrastructure that no longer matches what is committed.
#
# Applying is dispatch-only (see platform.yml), which means nothing converges
# the stack on a schedule and drift can sit unnoticed indefinitely. This is the
# other half of that trade: nothing changes anything automatically, but a
# divergence gets surfaced within a day.
#
# Read-only throughout. It runs under the PLAN role, never the apply role, and
# every terraform invocation uses -lock=false so it cannot block a real apply
# that happens to be running.
#
# Drift here is not hypothetical. Every one of these has actually happened:
#
#   * `aws eks create-access-entry` run by hand to restore cluster admin after
#     a CI apply revoked it — reverted by the next apply
#   * a Secret created with kubectl that exists in no manifest
#   * an EBS volume and an IAM role deleted by hand after a teardown left them
#     orphaned

on:
  schedule:
    # 06:00 UTC daily — before the working day in Europe, after any overnight
    # automation has settled.
    - cron: "0 6 * * *"
    # 1pm US Central, every day. Cron here is UTC only, and Central moves
    # between UTC-6 (CST) and UTC-5 (CDT), so both candidate hours are
    # scheduled and the `gate` job lets through only the one that is 1pm in
    # America/Chicago that day.
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: {}

concurrency:
  # Shares platform.yml's group so a drift check never overlaps an apply. It
  # is read-only, but a plan mid-apply reports garbage.
  group: platform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  issues: write

env:
  TF_VERSION: "1.14.7"
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_IN_AUTOMATION: "true"
  # No CLUSTER_NAME here: jobs that need it read it from
  # terraform/platform/terraform.tfvars via ./.github/actions/cluster-name.

jobs:
  # Decides from the cron that fired rather than the clock, so a scheduled run
  # GitHub starts late still counts: "0 18 * * *" is 1pm while Chicago is on
  # CDT (-0500), "0 19 * * *" while it is on CST (-0600). The 06:00 UTC run
  # and manual dispatches always proceed.
  gate:
    name: schedule gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Is this a run that should proceed?
        id: decide
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=America/Chicago date +%z)
          case "${GITHUB_EVENT_NAME}|${SCHEDULE}|${offset}" in
            "workflow_dispatch|"*)        run=true ;;
            "schedule|0 6 * * *|"*)       run=true ;;
            "schedule|0 18 * * *|-0500")  run=true ;;
            "schedule|0 19 * * *|-0600")  run=true ;;
            *)                            run=false ;;
          esac
          echo "event=${GITHUB_EVENT_NAME} schedule='${SCHEDULE}' chicago_offset=${offset} -> run=${run}"
          echo "run=${run}" >> "$GITHUB_OUTPUT"

  # Every Terraform root that describes AWS infrastructure. deploy/crossplane
  # and deploy/tls-local are left out: they target a local minikube cluster
  # with local state, so there is nothing here to compare them against.
  terraform:
    name: terraform drift (${{ matrix.root }})
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The ECR and CI root plans under its own role. The platform plan
          # role cannot read this root's state, and that split is deliberate.
          - root: ecr
            dir: terraform
            backend_config: state.s3.tfbackend
            role_var: TF_PLAN_ROLE_ARN
            needs_cluster: false
          - root: platform-dns
            dir: terraform/platform-dns
            backend_config: ../state.s3.tfbackend
            role_var: TF_PLATFORM_PLAN_ROLE_ARN
            needs_cluster: false
          - root: platform
            dir: terraform/platform
            backend_config: ../state.s3.tfbackend
            role_var: TF_PLATFORM_PLAN_ROLE_ARN
            needs_cluster: true
          - root: platform-db
            dir: terraform/platform-db
            backend_config: ../state.s3.tfbackend
            role_var: TF_PLATFORM_PLAN_ROLE_ARN
            needs_cluster: true
          - root: platform-addons
            dir: terraform/platform-addons
            backend_config: ../state.s3.tfbackend
            role_var: TF_PLATFORM_PLAN_ROLE_ARN
            needs_cluster: true
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/cluster-name

      # A root whose plan role has not been published yet is not bootstrapped.
      # Say so and skip, rather than failing credential setup with an opaque
      # OIDC error.
      - name: Plan role configured?
        id: role
        env:
          ROLE: ${{ vars[matrix.role_var] }}
        run: |
          if [ -n "${ROLE}" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "set=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.role_var }} is not set, so ${{ matrix.root }} is not bootstrapped — skipping"
          fi

      - uses: hashicorp/setup-terraform@v3
        if: steps.role.outputs.set == 'true'
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC, read-only)
        if: steps.role.outputs.set == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars[matrix.role_var] }}
          aws-region: ${{ env.AWS_REGION }}

      # Nothing deployed is not drift. With empty state and a config that
      # describes a cluster, `plan` reports 51 resources to add — which would
      # be a drift alarm every single morning after a teardown. So the roots
      # that describe the cluster check it exists before deciding anything is
      # wrong. The ECR root and the DNS zone stand on their own and are always
      # compared.
      - name: Is the stack deployed?
        id: deployed
        if: steps.role.outputs.set == 'true'
        run: |
          if [ "${{ matrix.needs_cluster }}" != "true" ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          elif aws eks describe-cluster --name "${CLUSTER_NAME}" --region "${AWS_REGION}" >/dev/null 2>&1; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${CLUSTER_NAME} is not deployed — nothing to compare ${{ matrix.root }} against"
          fi

      - name: Init
        if: steps.deployed.outputs.yes == 'true'
        run: terraform init -input=false -backend-config=${{ matrix.backend_config }}

      # -detailed-exitcode is what makes this a check rather than a report:
      #   0  no changes        — reality matches the configuration
      #   1  error             — the check itself is broken, fail loudly
      #   2  changes present   — drift, or an unapplied commit on main
      #
      # -lock=false because this must never queue behind or block a real apply.
      - name: Plan
        id: plan
        if: steps.deployed.outputs.yes == 'true'
        run: |
          set +e
          terraform plan -input=false -lock=false -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e

          # Exit 2 also covers a plan that changes nothing but output values.
          # Destroying a root leaves its state with no outputs, so the next
          # plan "adds" them back without touching any infrastructure — which
          # is how an emptied platform-dns failed this check. Only resource
          # changes count as drift.
          if [ "${code}" = 2 ]; then
            changed=$(terraform show -json tfplan | jq '[.resource_changes[]? | select(.change.actions != ["no-op"] and .change.actions != ["read"])] | length')
            if [ "${changed}" = 0 ]; then
              echo "::notice::${{ matrix.root }}: only output values differ, no infrastructure changes"
              code=0
            fi
          fi

          case "${code}" in
            0)
              echo "no drift in ${{ matrix.root }}"
              ;;
            2)
              # Fail the job. A matrix does not propagate job outputs
              # reliably — `needs.<job>.outputs.x` is whichever leg finished
              # last — so the job result is the only signal the report job can
              # trust, and drift is a result worth failing on anyway.
              echo "::error::${{ matrix.root }} has drifted from what is committed"
              grep -E "^  # |^Plan:" plan.txt | head -40 || true
              exit 1
              ;;
            *)
              echo "::error::terraform plan failed in ${{ matrix.root }}"
              tail -30 plan.txt
              exit 1
              ;;
          esac

      - name: Upload plan
        if: always() && steps.deployed.outputs.yes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: drift-plan-${{ matrix.root }}
          path: ${{ matrix.dir }}/plan.txt
          retention-days: 7

  # Terraform cannot see inside the cluster. ArgoCD self-heals what it owns, so
  # an Application that is still OutOfSync after its retry budget means
  # something it cannot reconcile — a manually edited object, or a manifest
  # that does not apply cleanly.
  kubernetes:
    name: kubernetes drift
    needs: gate
    if: needs.gate.outputs.run == 'true' && vars.TF_PLATFORM_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/cluster-name

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLATFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check ArgoCD sync state
        run: |
          set -euo pipefail
          if ! aws eks describe-cluster --name "${CLUSTER_NAME}" --region "${AWS_REGION}" >/dev/null 2>&1; then
            echo "::notice::${CLUSTER_NAME} is not deployed — skipping"
            exit 0
          fi
          aws eks update-kubeconfig --region "${AWS_REGION}" --name "${CLUSTER_NAME}"

          status=0

          apps=$(kubectl -n argocd get applications.argoproj.io \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.sync.status}{"\t"}{.status.health.status}{"\n"}{end}' 2>/dev/null || true)

          if [ -z "${apps}" ]; then
            echo "::warning::no ArgoCD Applications found — the cluster is up but nothing is being delivered to it"
          else
            printf 'application\tsync\thealth\n%s\n' "${apps}"
            while IFS=$'\t' read -r name sync health; do
              [ -n "${name}" ] || continue
              if [ "${sync}" != "Synced" ]; then
                echo "::warning::${name} is ${sync} — ArgoCD could not reconcile it to the committed manifests"
                status=1
              fi
              # Progressing is a rollout in flight, not drift. Treating it as
              # drift means every deploy files an alert, which is how a check
              # gets ignored. Only states ArgoCD cannot resolve on its own
              # count.
              case "${health}" in
                Healthy|Progressing) ;;
                *)
                  echo "::warning::${name} is ${health}"
                  status=1
                  ;;
              esac
            done <<< "${apps}"
          fi

          # Objects ArgoCD owns but that were changed outside git are reported
          # as the Application being OutOfSync above. This catches the other
          # direction: things running in the app namespaces that no
          # Application claims at all.
          orphans=$(kubectl get deploy,statefulset -n rhdh-lean \
            -o jsonpath='{range .items[*]}{.kind}/{.metadata.name}{"\t"}{.metadata.labels.app\.kubernetes\.io/instance}{"\n"}{end}' 2>/dev/null || true)
          while IFS=$'\t' read -r obj owner; do
            [ -n "${obj}" ] || continue
            if [ -z "${owner}" ]; then
              echo "::warning::${obj} in rhdh-lean is not owned by any ArgoCD Application"
              status=1
            fi
          done <<< "${orphans}"

          exit "${status}"

  report:
    name: report
    needs: [terraform, kubernetes]
    if: always() && (needs.terraform.result == 'failure' || needs.kubernetes.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      # One open issue, updated — not a new issue every morning, which is how
      # a drift check gets muted.
      - name: Open or update the drift issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Drift check reported a problem';
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The drift check reported a problem on ${new Date().toISOString().slice(0, 10)}.`,
              '',
              `[Run details](${url}) — the per-root plans are attached as artifacts.`,
              '',
              '**Check the run before assuming this is drift.** A job can fail',
              'because the check itself broke — expired or misscoped credentials',
              'being the usual cause — and that looks identical to a drifted',
              'plan from the outside. The plans attached to the run are what',
              'tell the two apart: a real drift has a diff in it.',
              '',
              'If it is drift, then either the infrastructure was changed outside',
              'Terraform, or main contains a commit that has not been applied.',
              'Applying is dispatch-only, so an unapplied merge shows up here',
              'rather than converging on its own:',
              '',
              '```',
              'gh workflow run platform.yml --ref main -f root=both',
              '```',
              '',
              'If the change was made by hand and should be kept, put it in the',
              'configuration — a manual change survives only until the next apply.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drift',
            });

            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['drift'],
              });
            }

name: platform

# The cluster, and the software that runs inside it. Separate from the
# `terraform` workflow on purpose: that one owns the ECR/CI plumbing and runs
# under a role that cannot touch a cluster, and vice versa.

on:
  pull_request:
    paths:
      - "terraform/platform/**"
      - "terraform/platform-addons/**"
      - ".github/workflows/platform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/platform/**"
      - "terraform/platform-addons/**"
      - ".github/workflows/platform.yml"
  workflow_dispatch:
    inputs:
      root:
        description: "Which root to apply"
        required: true
        default: "both"
        type: choice
        options: [both, platform, platform-addons]

concurrency:
  # Queue, never cancel. A cancelled apply can leave an S3 lock behind, and on
  # this workflow it can also leave a half-created cluster.
  group: platform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: "1.14.7"
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_IN_AUTOMATION: "true"

jobs:
  # ---------------------------------------------------------------- plan (PR)
  plan:
    name: plan (${{ matrix.root }})
    # Skips until the platform roles exist. They are created by this very
    # configuration, so before the bootstrap apply there is nothing to assume
    # and a plan here could only fail — see "Applying" in
    # terraform/platform/README.md. Once TF_PLATFORM_PLAN_ROLE_ARN is set, this
    # starts running on its own.
    if: github.event_name == 'pull_request' && vars.TF_PLATFORM_PLAN_ROLE_ARN != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: [platform, platform-addons]
    defaults:
      run:
        shell: bash
        working-directory: terraform/${{ matrix.root }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC, read-only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLATFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      # platform-addons cannot be planned before the cluster exists — its
      # providers authenticate against an endpoint that comes from the other
      # root's state. Report that as a skip rather than a failure so a PR that
      # only touches addons is still reviewable.
      - name: Plan
        id: plan
        continue-on-error: ${{ matrix.root == 'platform-addons' }}
        run: terraform plan -input=false -lock=false -no-color -out=tfplan | tee plan.txt

      - name: Comment plan on PR
        if: always() && steps.plan.outcome == 'success'
        uses: actions/github-script@v7
        env:
          PLAN_PATH: terraform/${{ matrix.root }}/plan.txt
          ROOT: ${{ matrix.root }}
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync(process.env.PLAN_PATH, 'utf8');
            const LIMIT = 60000;
            if (plan.length > LIMIT) {
              plan = plan.slice(-LIMIT) + '\n\n...output truncated, see the job log for the full plan.';
            }
            const body = [
              `#### Terraform plan — \`${process.env.ROOT}\``,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # ------------------------------------------------------------- apply (main)
  # Two sequential jobs rather than a matrix: the addons root reads the
  # cluster root's outputs, so it must never start before that one finishes.
  apply-platform:
    name: apply (platform)
    if: >-
      github.event_name != 'pull_request' &&
      vars.TF_PLATFORM_APPLY_ROLE_ARN != '' &&
      (github.event.inputs.root == null || github.event.inputs.root == 'both' || github.event.inputs.root == 'platform')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform/platform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC, read/write)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLATFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init -input=false

      - name: Apply
        run: terraform apply -input=false -auto-approve

      - name: Outputs
        run: terraform output

  apply-addons:
    name: apply (platform-addons)
    needs: apply-platform
    # `always()` so a dispatch that targets addons alone still runs when the
    # cluster job was skipped — but not when it actually failed.
    if: >-
      always() &&
      needs.apply-platform.result != 'failure' &&
      needs.apply-platform.result != 'cancelled' &&
      github.event_name != 'pull_request' &&
      vars.TF_PLATFORM_APPLY_ROLE_ARN != '' &&
      (github.event.inputs.root == null || github.event.inputs.root == 'both' || github.event.inputs.root == 'platform-addons')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform/platform-addons
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC, read/write)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLATFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init -input=false

      - name: Apply
        run: terraform apply -input=false -auto-approve

      - name: Outputs
        run: terraform output

  # --------------------------------------------------------------- smoke test
  # "Applied" is not "healthy". This is what makes the difference visible.
  verify:
    name: verify cluster health
    needs: apply-addons
    if: needs.apply-addons.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLATFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Kubeconfig
        run: aws eks update-kubeconfig --region "${AWS_REGION}" --name edx-rhdh

      - name: Nodes are Ready
        run: |
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          kubectl get nodes -o wide

      - name: Core deployments rolled out
        run: |
          set -euo pipefail
          kubectl -n ingress-nginx rollout status deploy/ingress-nginx-controller --timeout=300s
          kubectl -n argocd rollout status deploy/argocd-server --timeout=300s
          kubectl -n argocd rollout status deploy/argocd-repo-server --timeout=300s

      - name: Load balancer has an address
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            host=$(kubectl -n ingress-nginx get svc ingress-nginx-controller \
              -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "${host}" ]; then echo "ingress hostname: ${host}"; exit 0; fi
            echo "waiting for load balancer... (${i}/30)"; sleep 10
          done
          echo "::error::ingress-nginx never received a load balancer hostname"
          kubectl -n ingress-nginx describe svc ingress-nginx-controller
          exit 1

      - name: Nothing is crash-looping
        run: |
          set -euo pipefail
          bad=$(kubectl get pods -A \
            --field-selector=status.phase!=Running,status.phase!=Succeeded \
            --no-headers 2>/dev/null | wc -l)
          kubectl get pods -A
          if [ "${bad}" -ne 0 ]; then
            echo "::error::${bad} pod(s) not Running or Succeeded"
            exit 1
          fi

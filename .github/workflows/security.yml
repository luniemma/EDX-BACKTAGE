name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly full scan (Mondays 06:00 UTC) — catches newly disclosed CVEs in
    # things that haven't changed but got worse.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Code scanning is free on public repos, so SARIF uploads work here. If this
# repo is ever made private again they will 403 without GitHub Advanced
# Security — at that point drop the upload steps, not the fail gates, which are
# what actually block.
permissions:
  contents: read
  security-events: write
  actions: read

# CodeQL and `yarn audit` are gone with the application source. What is left to
# scan is configuration: the rendered manifests, the IaC, and the repo's own
# history. The RHDH image itself is Red Hat's to patch — scanning it here would
# produce findings nobody in this repo can fix, so the lever is the pinned tag
# in deploy/helm/rhdh/values.yaml, not a gate.
jobs:
  trivy-fs:
    name: Trivy filesystem (IaC + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: rendered,.terraform
          trivyignores: .trivyignore
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Fail on findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: true
          skip-dirs: rendered,.terraform
          trivyignores: .trivyignore

  trivy-config:
    name: Trivy config (rendered manifests + IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Render Helm chart for scanning
        run: |
          mkdir -p rendered
          helm repo add rhdh https://redhat-developer.github.io/rhdh-chart
          helm repo update
          helm dependency build deploy/helm/rhdh
          helm template rhdh deploy/helm/rhdh \
            -f deploy/helm/rhdh/values.yaml \
            -f deploy/helm/rhdh/values-prod.yaml \
            --set backstage.upstream.backstage.appConfig.backend.database.connection.host=postgres.scan.invalid \
            > rendered/all.yaml

      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          severity: CRITICAL,HIGH,MEDIUM
          skip-dirs: .terraform
          trivyignores: .trivyignore
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
      - name: Fail on high+ misconfig
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          skip-dirs: .terraform
          trivyignores: .trivyignore

  gitleaks:
    name: Gitleaks (secret scanning)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Uncomment if you have a Gitleaks Pro license:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        with:
          config-path: .gitleaks.toml

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# There is no application to build any more. RHDH ships as a prebuilt image, so
# what CI can still verify is that the chart renders, the catalog entities parse
# and every catalog target actually exists.
jobs:
  helm:
    name: helm lint + template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      # `dependency build` resolves the repository URL against the runner's own
      # repo list, which starts empty -- without this it fails with
      # "no repository definition for https://redhat-developer.github.io/rhdh-chart".
      - name: Add RHDH chart repository
        run: |
          helm repo add rhdh https://redhat-developer.github.io/rhdh-chart
          helm repo update

      # The RHDH chart is a dependency, not vendored. Chart.lock pins it, so
      # `build` (not `update`) is what enforces the pin.
      - name: Fetch chart dependencies
        run: helm dependency build deploy/helm/rhdh

      - name: Helm lint
        run: helm lint deploy/helm/rhdh -f deploy/helm/rhdh/values.yaml -f deploy/helm/rhdh/values-dev.yaml

      - name: Helm template (dev)
        run: |
          helm template rhdh deploy/helm/rhdh \
            -f deploy/helm/rhdh/values.yaml \
            -f deploy/helm/rhdh/values-dev.yaml \
            > /tmp/rendered-dev.yaml

      # lean now ships without a host AND without a database host: the NLB
      # comes from terraform/platform-addons and the endpoint from
      # terraform/platform-db, so neither exists until those are applied.
      # Supply throwaway values to exercise the rest of the chart — the same
      # treatment staging and prod get below.
      - name: Helm template (lean)
        run: |
          helm template rhdh deploy/helm/rhdh \
            -f deploy/helm/rhdh/values.yaml \
            -f deploy/helm/rhdh/values-lean.yaml \
            --set global.host=lean.ci.invalid \
            --set backstage.upstream.ingress.host=lean.ci.invalid \
            --set backstage.upstream.backstage.appConfig.backend.database.connection.host=postgres.ci.invalid \
            > /tmp/rendered-lean.yaml

      # staging and prod deliberately ship without a database host committed,
      # and templates/validate.yaml fails the render when one is missing — so
      # supply a throwaway endpoint to exercise the rest of the chart.
      - name: Helm template (staging)
        run: |
          helm template rhdh deploy/helm/rhdh \
            -f deploy/helm/rhdh/values.yaml \
            -f deploy/helm/rhdh/values-staging.yaml \
            --set backstage.upstream.backstage.appConfig.backend.database.connection.host=postgres.ci.invalid \
            > /tmp/rendered-staging.yaml

      - name: Helm template (prod)
        run: |
          helm template rhdh deploy/helm/rhdh \
            -f deploy/helm/rhdh/values.yaml \
            -f deploy/helm/rhdh/values-prod.yaml \
            --set backstage.upstream.backstage.appConfig.backend.database.connection.host=postgres.ci.invalid \
            > /tmp/rendered-prod.yaml

      # The chart pins the image in two places and they drift silently: the tag
      # is what runs, appVersion is what the README and NOTES claim runs.
      - name: Image tag matches Chart appVersion
        run: |
          set -euo pipefail
          APP=$(yq -r '.appVersion' deploy/helm/rhdh/Chart.yaml)
          TAG=$(yq -r '.backstage.upstream.backstage.image.tag' deploy/helm/rhdh/values.yaml)
          IDX=$(yq -r '.global.catalogIndex.image.tag' deploy/helm/rhdh/values.yaml)
          echo "appVersion=${APP} image.tag=${TAG} catalogIndex.tag=${IDX}"
          if [ "${APP}" != "${TAG}" ] || [ "${APP}" != "${IDX}" ]; then
            echo "::error::Chart.yaml appVersion, image.tag and catalogIndex.image.tag must all match"
            exit 1
          fi

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: helm-rendered
          path: /tmp/rendered-*.yaml

  catalog:
    name: catalog + template entities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every catalog entity is now fetched over HTTP by the running portal
      # instead of being baked into an image, so a broken path fails at ingest
      # time in the cluster rather than at build time here. This job is what
      # moves that failure back into the PR.
      #
      # Scaffolder skeletons are excluded on purpose: they are Helm templates and
      # nunjucks, not entities, and do not parse as YAML.
      - name: Entities parse, and declare kind + metadata.name
        run: |
          set -euo pipefail
          status=0
          for f in catalog/*.yaml catalog/*/*.yaml examples/entities.yaml examples/org.yaml \
                   examples/template/template.yaml templates/*/template.yaml; do
            [ -f "$f" ] || continue
            if ! yq -e 'true' "$f" > /dev/null 2>&1; then
              echo "::error file=${f}::does not parse as YAML"
              status=1
              continue
            fi
            # A string literal in yq is a constant, so `select(...) | "x"` emits
            # "x" even when select matches nothing -- the old form failed every
            # file unconditionally. Count the matched documents instead, with
            # `ea` so multi-document files are evaluated as one stream.
            missing=$(yq ea -r '[select(.kind == null or .metadata.name == null)] | length' "$f")
            if [ "${missing}" != "0" ]; then
              echo "::error file=${f}::a document is missing kind or metadata.name"
              status=1
            fi
          done
          exit "${status}"

      # Targets in catalog/all.yaml are relative to that file, which is how
      # app-config gets away with naming a single location.
      - name: Location targets resolve
        run: |
          set -euo pipefail
          status=0
          for t in $(yq -r '.spec.targets[]' catalog/all.yaml); do
            path=$(realpath -m --relative-to=. "catalog/${t}")
            if [ ! -f "${path}" ]; then
              echo "::error file=catalog/all.yaml::target ${t} resolves to ${path}, which does not exist"
              status=1
            fi
          done
          exit "${status}"

# NOTE: the scaffolder copies this file verbatim (copyWithoutRender), so every
# ${{ ... }} below is a GitHub Actions expression, not a Backstage one. That is
# also why the service name and environment are read out of
# deploy/gitops-entry.yaml at runtime instead of being templated in.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lockfile ships in the skeleton, so this cannot be `npm ci` yet.
      # Commit the lockfile from your first install and switch it over.
      - run: npm install
      - run: npm test --if-present

  publish:
    name: push image + record in GitOps
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC federation with AWS
    steps:
      - uses: actions/checkout@v4

      # Single source of truth for where this service deploys. Change the entry
      # and the next build follows it — nothing here is hardcoded.
      - name: Read the ledger entry
        id: entry
        run: |
          set -euo pipefail
          {
            echo "name=$(yq '.service.name' deploy/gitops-entry.yaml)"
            echo "env=$(yq '.service.env' deploy/gitops-entry.yaml)"
            echo "repo=$(yq '.image.repository' deploy/gitops-entry.yaml)"
          } >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Compute image tag
        id: tag
        run: echo "tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.entry.outputs.repo }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only now is it safe to point the cluster at this tag. Recording the
      # version before the push would leave ArgoCD pulling an image that does
      # not exist yet.
      - name: Check out the GitOps ledger
        uses: actions/checkout@v4
        with:
          repository: luniemma/EDX-BACKTAGE
          token: ${{ secrets.APP_TOKEN }}
          path: gitops-repo

      - name: Record the new version
        env:
          NAME: ${{ steps.entry.outputs.name }}
          ENV: ${{ steps.entry.outputs.env }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          DEST="gitops-repo/gitops/services/${NAME}/${ENV}"
          mkdir -p "${DEST}"
          # Copy the whole entry rather than patching the tag: the first run
          # onboards the service, and later runs pick up any edit made here.
          cp deploy/gitops-entry.yaml "${DEST}/config.yaml"
          yq -i ".image.tag = \"${TAG}\"" "${DEST}/config.yaml"

      - name: Commit and push
        env:
          NAME: ${{ steps.entry.outputs.name }}
          ENV: ${{ steps.entry.outputs.env }}
          TAG: ${{ steps.tag.outputs.tag }}
        working-directory: gitops-repo
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Ledger already at ${TAG}, nothing to do"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "gitops/services/${NAME}/${ENV}/config.yaml"
          # [skip ci] because this touches only the ledger — the platform repo's
          # own test suite has nothing to say about it.
          git commit -m "chore(${NAME}): deploy ${TAG} to ${ENV} [skip ci]"
          git push

replicaCount: 1

image:
  # Left empty on purpose. ArgoCD overrides both from the GitOps ledger entry
  # (gitops/services/${{ values.name }}/${{ values.deployEnvironment }}/config.yaml in the
  # platform repo), so setting them here changes nothing about what deploys —
  # it just gives you two places to look when the wrong version is running.
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

# Populate if your registry needs credentials. ECR does; the platform provisions
# the repository but not the pull secret.
imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# The skeleton service serves /healthz on 8080. Keep these pointing at a real
# endpoint — an app with no readiness probe gets traffic before it can serve it.
probes:
  path: /healthz
  initialDelaySeconds: 5
  periodSeconds: 10

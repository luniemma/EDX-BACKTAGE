{{- if .Values.postgres.enabled -}}
{{- if not .Values.postgres.auth.existingSecret -}}
{{- fail "postgres.auth.existingSecret is required — the password comes from a Secret, never from values.yaml" -}}
{{- end -}}
# Headless Service. A StatefulSet needs one for stable per-pod DNS; the app
# talks to the Service name, which resolves to the single replica.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "service.postgresFullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
  selector:
    {{- include "service.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: database
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "service.postgresFullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ include "service.postgresFullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        {{- include "service.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database
    spec:
      securityContext:
        # 999 is the postgres user in the official image. The data directory
        # must be group-writable by it or initdb fails on first start.
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.auth.existingSecret }}
                  key: {{ .Values.postgres.auth.secretKey }}
            # Without a subdirectory, initdb refuses to run in a volume root
            # that contains lost+found — which most block storage provides.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # timeoutSeconds matters more than it looks: the default is 1 second,
          # and an exec probe shelling out to pg_isready exceeds that routinely
          # on slow storage. Omitting it makes the liveness probe restart a
          # healthy database every few minutes, and because the container exits
          # 0 on SIGTERM it reads as a clean shutdown rather than a probe bug.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.auth.username }}", "-d", "{{ .Values.postgres.auth.database }}"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.auth.username }}", "-d", "{{ .Values.postgres.auth.database }}"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            # Tolerant on purpose — restarting a database to recover from a slow
            # health check costs far more than waiting one more interval.
            failureThreshold: 6
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Set explicitly even though it is the default. The API server defaults
        # this field server-side, and volumeClaimTemplates is an atomic list —
        # so omitting it makes ArgoCD diff the StatefulSet as OutOfSync forever,
        # with selfHeal unable to converge because the field is immutable.
        volumeMode: Filesystem
        {{- with .Values.postgres.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
  {{- else }}
  volumeClaimTemplates: []
  {{- end }}
{{- end }}

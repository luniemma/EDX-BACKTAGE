apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: golden-path-service
  title: Golden Path Service
  description: |
    Scaffolds a Node.js service and everything needed to run it: a GitHub repo
    with CI that builds and publishes its image, a Helm chart, a GitOps ledger
    entry so ArgoCD picks it up on the first green build, and a Crossplane
    ServiceRegistry claim for its container registry.
  tags:
    - recommended
    - nodejs
    - golden-path
spec:
  owner: group:default/developers
  type: service

  parameters:
    - title: Service
      required:
        - name
        - owner
      properties:
        name:
          title: Name
          type: string
          description: Lowercase, dashes allowed. Used for the repo, the ArgoCD app and the registry.
          pattern: '^[a-z][a-z0-9-]{1,60}$'
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: What does this service do?
        owner:
          title: Owner
          type: string
          description: Team that owns it.
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group, User]

    - title: Infrastructure
      properties:
        provisionRegistry:
          title: Provision a container registry
          type: boolean
          default: true
          description: |
            Creates a Crossplane ServiceRegistry claim, which provisions an ECR
            repository. Uncheck to reuse an existing registry.
        deployEnvironment:
          title: Deploy to
          type: string
          default: dev
          enum: [dev, staging]
          description: Which ArgoCD environment this service targets.

    - title: Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-base
      name: Render the service
      action: fetch:template
      input:
        url: ./skeleton
        # The workflow is full of ${{ ... }} GitHub Actions expressions, which
        # share their delimiters with the scaffolder's own templating. Rendering
        # it would strip every one of them, so it is copied through untouched.
        copyWithoutRender:
          - .github/workflows/ci.yml
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}
          provisionRegistry: ${{ parameters.provisionRegistry }}
          deployEnvironment: ${{ parameters.deployEnvironment }}

    - id: publish
      name: Create the GitHub repo
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        # Protect main from the start rather than retrofitting it later.
        protectDefaultBranch: true
        repoVisibility: public

    - id: register
      name: Register in the catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish'].output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

  output:
    links:
      - title: Repository
        url: ${{ steps['publish'].output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
    text:
      - title: What happens next
        content: |
          Push to `main`. CI tests the service, builds its image, pushes it to
          ECR, and writes `deploy/gitops-entry.yaml` into the platform's GitOps
          ledger with the tag it just built. ArgoCD's `services` ApplicationSet
          turns that entry into an Application and syncs it. No one runs
          `kubectl`, and nothing deploys until there is a real image to deploy.

          The scaffolder never touches the cluster — it only creates a repo.
          Cluster state changes because a commit landed in the ledger, which is
          reviewable and revertible like any other commit.

      - title: Before the first build can succeed
        content: |
          The new repo needs three things set on it, none of which the
          scaffolder can create for you:

          - variable `AWS_ROLE_TO_ASSUME` — the role CI federates into to push
            to ECR
          - variable `AWS_REGION` — `us-east-1`
          - secret `APP_TOKEN` — a token with write access to the platform repo,
            so CI can record the version. It cannot be named `GITHUB_*`; GitHub
            reserves that prefix.

          If you asked for a registry, the `ServiceRegistry` claim in
          `deploy/serviceregistry.yaml` still has to be applied to the cluster by
          the platform team before ECR will accept the push.
